services:
  postgres:
    image: postgres:15-alpine
    profiles:
      - postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: autocareer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - autocareer-network

  scraper:
    build: ./backend/services/job-scraper
    ports:
      - "8001:8001"
    networks:
      - autocareer-network

  tailor:
    build: ./backend/services/resume-tailor
    ports:
      - "8000:8000"
    environment:
      - DATABASE_BACKEND=${DATABASE_BACKEND:-hybrid}
      - SQLITE_DATABASE_URL=${SQLITE_DATABASE_URL:-sqlite:////app/data/autocareer.db}
      - POSTGRES_DATABASE_URL=${POSTGRES_DATABASE_URL:-postgresql://user:password@postgres:5432/autocareer}
      - DB_SYNC_ENABLED=${DB_SYNC_ENABLED:-true}
      - SYNC_ON_BOOT=${SYNC_ON_BOOT:-true}
      - SYNC_ON_SHUTDOWN=${SYNC_ON_SHUTDOWN:-true}
      - SCRAPER_SERVICE_URL=http://scraper:8001
      # LLM engine: claude (default, uses your subscription) | gemini (fallback)
      - LLM_PROVIDER=${LLM_PROVIDER:-claude}
      # Claude subscription auth — generate with `claude setup-token`.
      # NOTE: ANTHROPIC_API_KEY is intentionally NOT passed; if set it would
      # shadow the OAuth token and bill pay-per-token instead of the plan.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-sonnet}
      # Gemini fallback key (only used when LLM_PROVIDER=gemini)
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DEBUG=true
    volumes:
      - ./backend/services/resume-tailor/data:/app/data
      - ./backend/services/resume-tailor/output:/app/output
    depends_on:
      - scraper
    networks:
      - autocareer-network

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - tailor
    networks:
      - autocareer-network

networks:
  autocareer-network:
    driver: bridge

volumes:
  postgres_data:
