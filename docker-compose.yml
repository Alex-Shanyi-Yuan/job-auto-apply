services:
  postgres:
    image: postgres:15-alpine
    profiles:
      - postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: autocareer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - autocareer-network

  scraper:
    build: ./backend/services/job-scraper
    ports:
      - "8001:8001"
    networks:
      - autocareer-network

  tailor:
    build: ./backend/services/resume-tailor
    ports:
      - "8000:8000"
    environment:
      - DATABASE_BACKEND=${DATABASE_BACKEND:-hybrid}
      - SQLITE_DATABASE_URL=${SQLITE_DATABASE_URL:-sqlite:////app/data/autocareer.db}
      - POSTGRES_DATABASE_URL=${POSTGRES_DATABASE_URL:-postgresql://user:password@postgres:5432/autocareer}
      - DB_SYNC_ENABLED=${DB_SYNC_ENABLED:-true}
      - SYNC_ON_BOOT=${SYNC_ON_BOOT:-true}
      - SYNC_ON_SHUTDOWN=${SYNC_ON_SHUTDOWN:-true}
      - SCRAPER_SERVICE_URL=http://scraper:8001
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DEBUG=true 
    volumes:
      - ./backend/services/resume-tailor/data:/app/data
      - ./backend/services/resume-tailor/output:/app/output
    depends_on:
      - scraper
    networks:
      - autocareer-network

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - tailor
    networks:
      - autocareer-network

networks:
  autocareer-network:
    driver: bridge

volumes:
  postgres_data:
